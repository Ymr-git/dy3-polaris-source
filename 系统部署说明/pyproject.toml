[project]
name = "dy3-polaris"
version = "0.1.0"
description = "Dy3+ Polaris 面向绿色健康照明场景的稀土发光材料科研证据分析与多智能体协同决策系统"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.28,<2",
    "Markdown>=3.3,<4",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "httpx>=0.27,<1",
    "websockets>=13,<14",
    "redis>=5.1,<6",
    "neo4j>=5.20,<6",
    "pymilvus>=2.4,<3",
    "psycopg[binary]>=3.2,<4",
    "uvicorn[standard]>=0.30,<1",
    "starlette>=0.37,<1",
    "sse-starlette>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5.0,<6",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
]

[project.scripts]
dy3-polaris = "dy3_polaris.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dy3_polaris*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: 全栈契约测试（走 /api/query 真实链路，较慢，需 -m integration 显式运行）",
]

[tool.mypy]
python_version = "3.11"
strict = true